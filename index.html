<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #392060 0%, #170f29 45%, #090711 100%);
      color: #fff;
    }
    .page {
      width: min(92%, 720px);
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .badge {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      color: #e9d5ff;
      font-size: 14px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: clamp(48px, 11vw, 92px);
      line-height: .95;
      letter-spacing: -4px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #fff, #f5c2ff, #c4b5fd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      max-width: 560px;
      margin: 0 auto 32px;
      color: #d8cfea;
      font-size: clamp(17px, 3vw, 21px);
      line-height: 1.6;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 24px;
      font: inherit;
      font-weight: 700;
      color: #1b1028;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,.3);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(0,0,0,.4); }
    button:active { transform: translateY(0); }
    .message {
      min-height: 30px;
      margin-top: 26px;
      color: #f5d0fe;
      font-size: 18px;
      opacity: 0;
      transform: translateY(8px);
      transition: .5s ease;
    }
    .message.show { opacity: 1; transform: translateY(0); }
    .orb {
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .22;
      animation: float 7s ease-in-out infinite;
    }
    .orb.one { background: #a855f7; top: -80px; left: -80px; }
    .orb.two { background: #ec4899; right: -90px; bottom: -90px; animation-delay: -3s; }
    .sparkle {
      position: fixed;
      top: -20px;
      font-size: 18px;
      animation: fall linear forwards;
      pointer-events: none;
    }
    @keyframes float { 50% { transform: translate(25px, 30px) scale(1.08); } }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="page">
    <div class="badge">A little birthday surprise ✨</div>
    <h1>Happy Birthday! 🎂</h1>
    <p class="subtitle">
      Wishing you a beautiful day filled with happiness, laughter,
      love and lots of reasons to smile.
    </p>
    <button id="wishButton">Open Your Wish 🎁</button>
    <p class="message" id="message">You deserve all the happiness in the world. 💜</p>
  </main>

  <script>
    const button = document.getElementById("wishButton");
    const message = document.getElementById("message");

    button.addEventListener("click", () => {
      message.classList.add("show");
      button.textContent = "Have an Amazing Birthday! ✨";
      burst();
    });

    function burst() {
      const symbols = ["✨", "💜", "🎉", "⭐", "🎈"];
      for (let i = 0; i < 35; i++) {
        const item = document.createElement("span");
        item.className = "sparkle";
        item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        item.style.left = Math.random() * 100 + "vw";
        item.style.animationDuration = 2 + Math.random() * 3 + "s";
        item.style.animationDelay = Math.random() * .7 + "s";
        document.body.appendChild(item);
        setTimeout(() => item.remove(), 5000);
      }
    }
  </script>
</body>
</html>
